# E3, PILOT OF THE DESCRIPTIVE OPERATORS (docs/ANALYSIS_PLAN.md v2.4 §2 RQ3 (б) and (а)): FF49, the same pilot
# period as pilot.yaml (test windows 1963-07-01 ... 1972-12-31, 112 folds), at lambda_f, BOTH arms.
#
# Why: the plan reads the levels L of the descriptive operators on the PILOT folds: "L - уровни, достигнутые хотя бы
# на 80 % фолдов пилотного периода"; L_a = {g in L: g <= g*}, and F_a, F_b are the CONFIRMATORY folds where every
# level of L_a / L is reached (plan §2; "L по плечам": one L per arm). The confirmatory run (ff49.yaml) runs the same
# operators; `python -m cif.experiments.e3_assemble` takes L from the registered run of THIS config
# (sources.pilot_operators of configs/E3/analysis.yaml). `levels_L` in analysis.yaml would override it.
#
# DO NOT RUN BEFORE the pilot report (e3_pilot) has chosen lambda_f and it is in §12 of the plan and below
# (null = the grid refuses to build). The levels, replicas and work limits of `operators` are those of ff49.yaml:
# "reached" (all 30 replicas found, at most 66 000 refinements per fold and level) must mean the same thing.
#
# A cell is (arm, fold): s_cont and K_f, the certified optimum and rank 2 (n_ranks: 1 - the status of the row is
# what lets the operators run; no tie check), and the operators (б) swap and (а) perturb on that arm. No real
# solver (H3c is a statement of the confirmation). Calibration seeds (10000-19999), not the pilot's own (10000).
# 2 arms x 112 folds = 224 cells (by the calendar of the FF49 dataset of 2026-10-08).
#
# Run server (plan §12: gpu-07 is shared, at most 16 single-thread jobs, pinned to physical cores): the operators
# stop by their step limits, not by the clock, so launch.timing is false; 56 shards of 4 cells (2 MV and 2 GMV).
stream: E3
name: ff49_pilot_operators
experiment: cif.experiments.e3_walkforward
seeds: [10001]
inputs:
  ff49: data/processed/ff49/provenance.json
launch: {jobs: 16, shards: 56, timing: false}
params:
  seed_role: calibration
  solver_seed: 10001
  market:
    name: ff49
    source: ff49
    data_dir: data/processed/ff49
    u: 0.20
    train_days: 756
    test_days: 21
  period: {name: pilot, start: "1963-07-01", end: "1972-12-31"}
  arms: [MV, GMV]
  lambda_f: 20.0              # [пилот] §12 2026-10-12, run 20261011-232931-E3-pilot-acc916
  lambdas: null
  n_ranks: 1
  optimum: {time_limit_s: 7200.0, mip_gap: 1.0e-6, formulation: perspective, diag: mineig}
  kbest: {time_limit_s: 600.0, card_mode: eq, abs_gap_rel: 1.0e-6, warm_start: true, boundary_check: false}
  solvers: null
  operators:                  # the same as ff49.yaml: at most 66 000 refinements per fold and level, no clock
    arms: [MV, GMV]
    swap: {levels: [1, 2, 5, 10, 25, 50, 100], n_replicas: 30, max_steps: 200, max_restarts: 10}
    perturb: {levels: [1, 2, 5, 10, 25, 50, 100], n_replicas: 30, max_draws: 100000}
# --smoke: a synthetic factor-model market (no FF49 data is read), a few cells, a minute on a laptop
smoke:
  seeds: [10001]
  launch: {jobs: 2, shards: 4, timing: false}
  params:
    market: {name: synthetic, source: synthetic, n_assets: 12, n_days: 300, seed: 1000, start: "2000-01-03",
             u: 0.34, train_days: 60, test_days: 5, gap_fraction: 0.0}
    period: {name: pilot, start: "2000-06-01", end: "2000-07-15"}
    lambda_f: 5.0
    optimum: {time_limit_s: 60.0}
    kbest: {time_limit_s: 60.0}
    operators:
      arms: [MV, GMV]
      swap: {levels: [10, 500], n_replicas: 3, max_steps: 60, max_restarts: 3}
      perturb: {levels: [10, 500], n_replicas: 3, max_draws: 2000}
